[package]
name = "m0-prototype"
description = "M0 Slint prototype: XFCE-referenced shell UI fed by the capability probe and the XDG app index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
desktop-entry = { path = "../desktop-entry" }
launch-core = { path = "../launch-core" }
slint = { workspace = true }
wayland-probe = { path = "../wayland-probe" }

[lib]
name = "m0_prototype"
path = "src/lib.rs"

[[bin]]
name = "m0-prototype"
path = "src/main.rs"

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
