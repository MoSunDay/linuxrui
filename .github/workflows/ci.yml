# Regression net for the M0 baseline (docs/adr/0001): mirrors the local
# verification trio -- fmt --check, clippy -D warnings, test --locked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Slint's text stack links fontconfig/freetype at build time via
      # fontique -> yeslogic-fontconfig-sys (see ldd evidence in
      # docs/verification/). The rest of the tree is pure Rust or dlopen-based.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev

      # rustup resolves and installs the toolchain pinned in rust-toolchain.toml.
      - name: Show active toolchain
        run: rustup show

      # Runner images default to the minimal rustup profile, which omits
      # rustfmt/clippy; add them explicitly for the pinned toolchain.
      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

  # Compositor smoke (docs/adr/0002): the shell must map a real xdg-shell
  # window in a sway headless session, not merely compile.
  sway-headless:
    name: sway headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show active toolchain
        run: rustup show

      - name: Install sway session and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev sway grim fonts-dejavu-core

      - uses: Swatinem/rust-cache@v2

      - name: Build m0-prototype
        run: cargo build -p m0-prototype --locked

      - name: Run headless compositor smoke
        run: |
          bash scripts/sway-headless-run.sh target/debug/m0-prototype evidence

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sway-headless-evidence
          path: evidence
          if-no-files-found: ignore
